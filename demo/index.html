<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask the deal wiki</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f1f3f5;
    --sheet: #ffffff;
    --ink: #1d2733;
    --muted: #5a6778;
    --rule: #ccd4dd;
    --source: #2e5e86;
    --source-bg: #dce6f0;
    --alert: #8a4b00;
    --alert-bg: #f6ead9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #161d25;
      --sheet: #1d2630;
      --ink: #e4e9ef;
      --muted: #9aa6b4;
      --rule: #2e3946;
      --source: #a9c9e6;
      --source-bg: #22344a;
      --alert: #f0c27a;
      --alert-bg: #3a2c17;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 1rem/1.5 "Public Sans", "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 46rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 0.5rem; }
  .lede { color: var(--muted); margin: 0 0 2rem; max-width: 38rem; }
  label { display: block; font-weight: 600; margin-bottom: 0.4rem; }
  textarea {
    width: 100%; min-height: 6rem; resize: vertical;
    padding: 0.75rem 0.85rem; border: 1px solid var(--rule); border-radius: 6px;
    background: var(--sheet); color: var(--ink); font: inherit;
  }
  .row { display: flex; align-items: center; gap: 1rem; margin-top: 0.75rem; flex-wrap: wrap; }
  button.ask {
    font: 600 1rem/1 "Public Sans", sans-serif; padding: 0.7rem 1.4rem;
    background: var(--ink); color: var(--paper); border: 0; border-radius: 6px; cursor: pointer;
  }
  button.ask:disabled { opacity: 0.5; cursor: progress; }
  .hint { color: var(--muted); font-size: 0.875rem; }
  .examples { margin: 1.5rem 0 0; padding: 0; list-style: none; }
  .examples p { margin: 0 0 0.4rem; font-weight: 600; }
  .examples button {
    display: block; text-align: left; width: 100%; margin: 0 0 0.35rem;
    padding: 0.45rem 0.7rem; background: transparent; color: var(--ink);
    border: 1px solid var(--rule); border-radius: 6px; font: inherit; font-size: 0.925rem; cursor: pointer;
  }
  .examples button:hover { border-color: var(--muted); }
  :focus-visible { outline: 2px solid var(--source); outline-offset: 2px; }

  #result { margin-top: 2.5rem; }
  .asked { color: var(--muted); font-size: 0.925rem; margin: 0 0 0.75rem; }
  .answer {
    background: var(--sheet); border: 1px solid var(--rule); border-radius: 8px;
    padding: 1.4rem 1.5rem;
    font: 400 1.0625rem/1.65 "Source Serif 4", Georgia, serif;
  }
  .answer p { margin: 0 0 0.9rem; }
  .answer p:last-child, .answer ul:last-child { margin-bottom: 0; }
  .answer ul { margin: 0 0 0.9rem; padding-left: 1.2rem; }
  .answer li { margin-bottom: 0.35rem; }
  .src {
    font: 500 0.8rem/1.3 "Public Sans", sans-serif; color: var(--source); background: var(--source-bg);
    padding: 0.1rem 0.4rem; border-radius: 4px; white-space: normal;
  }
  .note {
    margin: 0 0 1rem; padding: 0.75rem 1rem; border-radius: 6px;
    background: var(--alert-bg); color: var(--alert);
  }
  dl.cost {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.75rem;
    margin: 1rem 0 0; padding: 0;
  }
  dl.cost div { border-top: 1px solid var(--rule); padding-top: 0.5rem; }
  dl.cost dt { color: var(--muted); font-size: 0.8rem; }
  dl.cost dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .working { display: flex; align-items: center; gap: 0.75rem; color: var(--muted); }
  .bar { flex: 1; height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
  .bar span { display: block; width: 30%; height: 100%; background: var(--source); animation: slide 1.6s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100%; opacity: 0.4; } }
  @media (max-width: 34rem) { dl.cost { grid-template-columns: repeat(2, minmax(0, 1fr)); } h1 { font-size: 1.6rem; } }
</style>
</head>
<body>
<main>
  <h1>Ask the deal wiki</h1>
  <p class="lede">Answers come only from a wiki an agent built from the Squarespace take-private filings.
    Each fact names the wiki page it came from and the date it was true. If the wiki doesn’t cover
    a question, the answer says so.</p>

  <label for="q">Your question</label>
  <textarea id="q" maxlength="1000" placeholder="For example: what did the buyer pay per share?"></textarea>
  <div class="row">
    <button class="ask" id="ask">Ask</button>
    <span class="hint" id="hint">An answer usually takes under a minute.</span>
  </div>

  <div class="examples">
    <p>Or try one of these</p>
    <button type="button" data-q="What is the per-share merger consideration, and how did it change during the process?">What is the per-share merger consideration, and how did it change?</button>
    <button type="button" data-q="I've seen more than one FY2023 adjusted EBITDA figure in this room. Reconcile them - are they comparable?">Reconcile the FY2023 adjusted EBITDA figures: are they comparable?</button>
    <button type="button" data-q="Which legal entities make up the buyer side of the take-private - the parent, the purchaser, the merger subsidiary and the funds behind them - how are they related, and which of them merged into the company? Name entities only, not individuals.">Which legal entities make up the buyer side, and which one merged into the company?</button>
    <button type="button" data-q="What was the company's revenue for fiscal year 2025?">What was the company’s revenue for fiscal year 2025?</button>
  </div>

  <section id="result" aria-live="polite"></section>
</main>

<script>
const box = document.getElementById("q");
const askButton = document.getElementById("ask");
const result = document.getElementById("result");

document.querySelectorAll(".examples button").forEach(b => {
  b.addEventListener("click", () => { box.value = b.dataset.q; ask(); });
});
askButton.addEventListener("click", ask);
box.addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) ask(); });

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

// The answer comes from documents an agent read, so it is never inserted as HTML: it is split into
// paragraphs, bullets and inline pieces, and each piece goes in as text. Source tags get their own style.
const INLINE = /(\[\[[^\]\n]+\]\]|\[[^\[\]\n]*as-of[^\[\]\n]*\]|\[source:[^\[\]\n]*\]|\*\*[^*\n]+\*\*)/g;
function inline(parent, text) {
  for (const part of text.split(INLINE)) {
    if (!part) continue;
    if (part.startsWith("**") && part.endsWith("**")) parent.appendChild(el("strong", "", part.slice(2, -2)));
    else if (part.startsWith("[")) parent.appendChild(el("span", "src", part.replace(/^\[\[?|\]?\]$/g, "")));
    else parent.appendChild(document.createTextNode(part));
  }
}
function renderAnswer(text) {
  const wrap = el("div", "answer");
  for (const block of text.split(/\n\s*\n/)) {
    const lines = block.split("\n").filter(l => l.trim());
    if (!lines.length) continue;
    let list = null, para = null;
    for (const line of lines) {
      const m = line.match(/^\s*[*\-•]\s+(.*)$/);
      if (m) {
        if (!list) { list = el("ul"); wrap.appendChild(list); para = null; }
        const li = el("li"); inline(li, m[1]); list.appendChild(li);
      } else {
        if (!para) { para = el("p"); wrap.appendChild(para); list = null; }
        else para.appendChild(document.createElement("br"));
        inline(para, line.replace(/^#+\s*/, ""));
      }
    }
  }
  return wrap;
}

function costGrid(r) {
  const dl = el("dl", "cost");
  const items = [
    ["Wiki reads and searches", String(r.reads_searches)],
    ["Tokens read", r.tokens_in.toLocaleString()],
    ["Cost from tokens", "$" + r.priced_usd.toFixed(3)],
    ["Time", r.seconds + " s"],
  ];
  for (const [k, v] of items) {
    const d = el("div"); d.appendChild(el("dt", "", k)); d.appendChild(el("dd", "", v)); dl.appendChild(d);
  }
  return dl;
}

async function ask() {
  const question = box.value.trim();
  if (!question) { box.focus(); return; }
  askButton.disabled = true;
  result.replaceChildren();
  const working = el("div", "working");
  const label = el("span", "", "Reading the wiki… 0 s");
  const bar = el("div", "bar"); bar.appendChild(el("span"));
  working.append(label, bar);
  result.appendChild(working);
  const t0 = Date.now();
  const timer = setInterval(() => { label.textContent = "Reading the wiki… " + Math.round((Date.now() - t0) / 1000) + " s"; }, 1000);
  try {
    const res = await fetch("/ask", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }),
    });
    const data = await res.json();
    result.replaceChildren();
    if (!res.ok) {
      result.appendChild(el("p", "note", data.detail || ("The request failed with status " + res.status + ". Ask again.")));
      return;
    }
    result.appendChild(el("p", "asked", "You asked: " + question));
    if (data.outcome_note) result.appendChild(el("p", "note", "This answer may be incomplete: " + data.outcome_note + "."));
    if (!data.session_archived) result.appendChild(el("p", "note", "The session " + data.session_id + " could not be archived. Close it from the terminal."));
    result.appendChild(renderAnswer(data.answer || "No answer came back. Ask again."));
    result.appendChild(costGrid(data));
  } catch (err) {
    result.replaceChildren(el("p", "note", "The app didn’t respond: " + err.message + ". Check that the server is still running, then ask again."));
  } finally {
    clearInterval(timer);
    askButton.disabled = false;
  }
}
</script>
</body>
</html>
